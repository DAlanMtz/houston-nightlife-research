<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380" role="img" aria-labelledby="fig32m-t fig32m-d"><title id="fig32m-t">Real reported mixed-beverage receipts, 2013 to 2025</title><desc id="fig32m-d">Real receipts rise from $442.9M in 2013 to a $614.9M peak in 2022, after a 2020 fall to $275.9M, then decline to $519.1M in 2025.</desc><rect width="360" height="380" fill="#F7F2E8"/><rect x="174.0" y="30" width="20.0" height="316" fill="#EFE8DA"/><text x="184.0" y="22.0" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="400" fill="#5A6470" text-anchor="middle" >2020</text><line x1="44.0" y1="346.0" x2="284.0" y2="346.0" stroke="#E4DCCD" stroke-width="1" /><text x="37.0" y="349.5" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#5A6470" text-anchor="end" >$0M</text><line x1="44.0" y1="210.6" x2="284.0" y2="210.6" stroke="#E4DCCD" stroke-width="1" /><text x="37.0" y="214.1" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#5A6470" text-anchor="end" >$300M</text><line x1="44.0" y1="75.1" x2="284.0" y2="75.1" stroke="#E4DCCD" stroke-width="1" /><text x="37.0" y="78.6" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#5A6470" text-anchor="end" >$600M</text><line x1="44.0" y1="346.0" x2="284.0" y2="346.0" stroke="#8A8172" stroke-width="0.9" /><text x="44.0" y="364.0" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#5A6470" text-anchor="middle" >2013</text><text x="124.0" y="364.0" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#5A6470" text-anchor="middle" >2017</text><text x="204.0" y="364.0" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="400" fill="#5A6470" text-anchor="middle" >2021</text><text x="284.0" y="364.0" f